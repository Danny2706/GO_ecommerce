services:
  redis:
    image: redis:7-alpine
    container_name: habeshamart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habeshamart-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data: